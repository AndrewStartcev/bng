name: Export BNG ACF Local JSON
on:
  push:
    branches: [main]
    paths:
      - 'scripts/export-acf-json.php'
      - '.github/workflows/export-acf-json.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
      - name: Generate all ACF field groups
        run: php scripts/export-acf-json.php
      - name: Verify 17 valid ACF JSON groups
        run: |
          php -r '
            $files = glob("acf-json/group_bng_*.json");
            if (count($files) !== 17) exit(1);
            foreach ($files as $file) {
              $group = json_decode(file_get_contents($file), true);
              if (empty($group["key"]) || empty($group["fields"]) || empty($group["location"])) exit(2);
            }
            echo "17 groups OK\n";
          '
      - name: Commit Local JSON groups to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add acf-json/group_bng_*.json
          if ! git diff --cached --quiet; then
            git commit -m "feat: export 17 BNG ACF field groups to Local JSON"
            git push origin HEAD:main
          fi
