<sc-if value="{{ isRock }}" hint-placeholder-val="{{ false }}">
      <section>
        <div style="margin-top:44px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:end">
          <h1 style="font-family:'PT Serif',Georgia,serif;font-weight:400;font-size:clamp(32px,3.4vw,46px);line-height:1.12;margin:0">{{ t.rock.title }}</h1>
          <p style="font-size:16px;line-height:1.6;color:#3C4247;margin:0;text-wrap:pretty">{{ t.rock.sub }}</p>
        </div>

        <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-top:48px;border-top:1px solid rgba(18,23,29,0.18)">
          <sc-for list="{{ assetFacts }}" as="f" hint-placeholder-count="5">
            <div style="padding:24px 24px 24px 0">
              <div style="font-family:'PT Serif',Georgia,serif;font-size:clamp(22px,2.2vw,32px);line-height:1;white-space:nowrap">{{ f.big }}</div>
              <div style="font-size:13px;line-height:1.5;color:#3C4247;margin-top:10px">{{ f.note }}</div>
            </div>
          </sc-for>
        </div>

        <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;margin-top:72px;align-items:start">
          <div>
            <h2 style="font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#6E747A;font-family:'PT Sans',system-ui,sans-serif;margin:0 0 26px">{{ t.rock.compTitle }}</h2>
            <sc-for list="{{ oreRows }}" as="o" hint-placeholder-count="4">
              <div style="margin-bottom:22px">
                <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
                  <span style="font-family:'PT Serif',Georgia,serif;font-size:19px">{{ o.formula }}<span style="font-size:13px;color:#6E747A;margin-left:10px;font-family:'PT Sans',system-ui,sans-serif">{{ o.name }}</span></span>
                  <span style="font-family:'PT Serif',Georgia,serif;font-size:17px">{{ o.pct }}</span>
                </div>
                <div style="height:8px;background:#EDEDEF">
                  <div style="height:100%;background:#12171D;min-width:3px;width:{{ o.w }}"></div>
                </div>
              </div>
            </sc-for>
            <p style="font-size:14px;line-height:1.6;color:#3C4247;margin-top:24px;text-wrap:pretty">{{ t.rock.compNote }}</p>
          </div>
          <div>
            <h2 style="font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#6E747A;font-family:'PT Sans',system-ui,sans-serif;margin:0 0 26px">{{ t.rock.surfaceTitle }}</h2>
            <sc-for list="{{ surfacePoints }}" as="p" hint-placeholder-count="4">
              <div style="display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;padding:18px 0;border-top:1px solid rgba(18,23,29,0.14)">
                <div style="font-family:'PT Serif',Georgia,serif;font-size:17px;white-space:nowrap">{{ p.k }}</div>
                <div style="font-size:14px;line-height:1.55;color:#3C4247">{{ p.v }}</div>
              </div>
            </sc-for>
          </div>
        </div>

        <div style="margin-top:72px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:end">
          <h2 style="font-family:'PT Serif',Georgia,serif;font-weight:400;font-size:30px;line-height:1.15;margin:0">{{ t.rock.mapTitle }}</h2>
          <p style="font-size:15px;line-height:1.6;color:#3C4247;margin:0;text-wrap:pretty">{{ t.rock.mapSub }}</p>
        </div>
        <iframe src="{{ mapSrc }}" title="{{ t.rock.mapTitle }}" sc-camel-on-load="{{ fitMap }}" scrolling="no" style="display:block;width:100%;height:720px;border:0;margin-top:28px;background:#ffffff"></iframe>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px;margin-top:72px">
          <figure class="blueprint" style="margin:0;padding:0;height:280px;position:relative">
            <image-slot id="bng-rock-core" shape="rect" fit="cover" placeholder="Core trays, drill floor — tags and depth marks legible"></image-slot>
          </figure>
          <figure class="blueprint" style="margin:0;padding:0;height:280px;position:relative">
            <image-slot id="bng-rock-hand" shape="rect" fit="cover" placeholder="Synnyrite in hand — scale is a hand or a ruler"></image-slot>
          </figure>
          <figure class="blueprint" style="margin:0;padding:0;height:280px;position:relative">
            <image-slot id="bng-rock-plant" shape="rect" fit="cover" placeholder="Pilot plant, pipe and vessel, eye level"></image-slot>
          </figure>
        </div>
      </section>
    </sc-if>
