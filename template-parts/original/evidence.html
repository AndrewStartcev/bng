<sc-if value="{{ isEvidence }}" hint-placeholder-val="{{ false }}">
      <section class="bng-evidence">
        <div class="bng-evidence-intro" style="margin-top:44px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:end">
          <h1 style="font-family:'PT Serif',Georgia,serif;font-weight:400;font-size:clamp(32px,3.4vw,46px);line-height:1.12;margin:0">{{ t.evidence.title }}</h1>
          <p style="font-size:16px;line-height:1.6;color:#3C4247;margin:0;text-wrap:pretty">{{ t.evidence.sub }}</p>
        </div>

        <div class="bng-evidence-columns" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:48px;margin-top:56px;align-items:start">
          <div>
            <h2 style="font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#12171D;font-family:'PT Sans',system-ui,sans-serif;margin:0 0 4px">{{ t.evidence.nowTitle }}</h2>
            <p style="font-size:12.5px;color:#6E747A;margin:0 0 18px">{{ t.evidence.nowNote }}</p>
            <sc-for list="{{ provable }}" as="p" hint-placeholder-count="8">
              <div style="display:grid;grid-template-columns:18px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid rgba(18,23,29,0.14)">
                <span style="font-family:'PT Serif',Georgia,serif;font-size:13px;color:#6E747A;padding-top:2px">{{ p.i }}</span>
                <span style="font-size:14.5px;line-height:1.55">{{ p.v }}</span>
              </div>
            </sc-for>
          </div>
          <div>
            <h2 style="font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#12171D;font-family:'PT Sans',system-ui,sans-serif;margin:0 0 4px">{{ t.evidence.earnTitle }}</h2>
            <p style="font-size:12.5px;color:#6E747A;margin:0 0 18px">{{ t.evidence.earnNote }}</p>
            <sc-for list="{{ earned }}" as="p" hint-placeholder-count="6">
              <div class="bng-evidence-pending-row" style="display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:14px;padding:14px 0;border-top:1px solid rgba(18,23,29,0.14)">
                <span style="font-size:14.5px;line-height:1.55;color:#3C4247">{{ p.v }}</span>
                <span style="font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#5A3D96;text-align:right;padding-top:2px">{{ p.when }}</span>
              </div>
            </sc-for>
          </div>
        </div>

        <div class="bng-evidence-dossier" style="background:#12171D;color:#ffffff;padding:52px 56px;margin-top:72px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:48px;align-items:center">
          <h2 style="font-family:'PT Serif',Georgia,serif;font-weight:400;font-size:28px;line-height:1.2;margin:0">{{ t.evidence.dossierTitle }}</h2>
          <div>
            <p style="font-size:15.5px;line-height:1.6;color:#D8DBDE;margin:0 0 24px">{{ t.evidence.dossierBody }}</p>
            <button sc-camel-on-click="{{ goCompany }}" style="appearance:none;cursor:pointer;font-family:'PT Sans',system-ui,sans-serif;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;padding:15px 26px;border:1px solid #7C5CBF;background:#7C5CBF;color:#ffffff" style-hover="background:#6B4BAE;border-color:#6B4BAE">{{ t.evidence.dossierCta }}</button>
          </div>
        </div>
      </section>
    </sc-if>
